name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build nextdm-host binary
        run: cargo build --release -p nextdm-browser-host --bin nextdm-host

      - name: Stage host binary into tauri bin
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/bin
          cp target/release/nextdm-host.exe apps/desktop/src-tauri/bin/nextdm-host.exe

      - name: Build Tauri Windows Bundle
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Prepare Windows Release Artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          cp target/release/nextdm-desktop.exe dist-windows/NextDM_0.1.0_x64_portable.exe
          cp target/release/nextdm-host.exe dist-windows/nextdm-host.exe
          if compgen -G "target/release/bundle/nsis/*.exe" > /dev/null; then
            cp target/release/bundle/nsis/*.exe dist-windows/
          fi
          ls -la dist-windows/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextDM-Windows-x64
          path: dist-windows/*

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for file in dist-windows/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file to GitHub release v0.1.0..."
              gh release upload v0.1.0 "$file" --clobber || true
            fi
          done
